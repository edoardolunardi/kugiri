name: Feature request
description: A situation the split should handle, or an option it lacks.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome. Only the first field is required. For context, kugiri structures and marks
        the text and leaves the animation and the watching of the page to the code that calls it, so
        the requests that fit best are about what the split produces; but if you are not sure where
        an idea sits, open it anyway and we will work it out.

  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: The situation, the option, or the thing the units should carry, and what you would do with it.
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: An example
      description: Markup, CSS, a link, or the demo case closest to it. Anything that makes it concrete.
