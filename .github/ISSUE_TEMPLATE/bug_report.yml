name: Bug report
description: A split that does not match what the browser painted, or throws.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Only the first field is required; the rest help find the cause faster, so
        fill in what you can. If you only have a screenshot and a hunch, that is fine too.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What the split produced, and what you expected instead. If it threw, the error is enough.
      placeholder: The second line came out as two units, and the word after the link was lost.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: How to see it
      description: |
        A link to a page that shows it (StackBlitz, CodePen, your site, a repository), or the markup and
        the CSS pasted here. The styles that decide where text wraps matter most: the font, the width,
        `text-wrap`, `hyphens`, `columns`, `white-space`, floats.

  - type: textarea
    id: call
    attributes:
      label: The call
      description: How `splitText` was called, if you have it handy.
      render: ts
      placeholder: 'splitText(target, { type: ["words"], mask: "lines" });'

  - type: input
    id: environment
    attributes:
      label: Browser and version
      placeholder: Safari 26.1 on macOS, Chrome 143 on Windows

  - type: input
    id: version
    attributes:
      label: kugiri version
      placeholder: 0.3.0

  - type: markdown
    attributes:
      value: |
        Two things account for a good share of reports, in case they save you a wait: a split is a
        snapshot of one layout, so it is worth running it after the fonts have loaded and again after
        anything that moves a wrap (a resize, new text). And a piece that is not text (an image, an
        inline-block, a float) is left whole on purpose; the README's "What a unit is" section says which.
